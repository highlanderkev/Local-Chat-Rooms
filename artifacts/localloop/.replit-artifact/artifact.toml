kind = "web"
previewPath = "/"
title = "LocalLoop"
description = "A mobile-first community chat app that uses your GPS location to discover and join nearby neighborhood chat rooms. Users can see rooms within a configurable radius, create new rooms for their area, and chat in real time with others nearby. Identity is anonymous with randomly assigned colored usernames."
version = "1.0.0"
id = "artifacts/localloop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20780

[services.development]
run = "pnpm --filter @workspace/localloop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/localloop", "run", "build" ]
serve = "static"
publicDir = "artifacts/localloop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20780"
BASE_PATH = "/"
